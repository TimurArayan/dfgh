[colors]
background = #0d0f15
foreground = #43d0b1
workspace-selected = #ffffff
workspace-selected-text = #000000


[bar/main]
width = 100%
height = 40
bottom = true
enable-ipc = true


separator-foreground = #ffffff


background = ${colors.background}
foreground = ${colors.foreground}

font-0 = Nunito Sans:style=SemiBold:size=14;4
font-1 = Nunito Sans:style=SemiBold:size=12;4
font-2 = Symbols Nerd Font Mono:size=19;4
font-3 = Nunito Sans:style=Regular:size=15;3

modules-left = workspace-apps


modules-right = volume keyboard clock rofi-placeholder


[module/rofi-placeholder]
type = custom/text
label-font = 3
label = ""
label-foreground = #FF0055
label-padding = 8px
click-left = sh -c 'pkill -x rofi || exec rofi -show drun -theme /home/t/.config/rofi/menu.rasi -normal-window'


[module/clock]
label-font = 2
type = internal/date
interval = 1
time = %H:%M:%S
time-alt = %H:%M
label = %time%
label-padding = 8px



[module/keyboard]
label-layout-font = 4
type = internal/xkeyboard
format = <label-layout>
label-layout = %icon%
layout-icon-0 = us;en
layout-icon-1 = ru;%{O2px}ru%{O2px}
label-layout-padding = 0px



[module/volume]
label-volume-font = 2
label-muted-font = 1
type = internal/pulseaudio
use-ui-max = false
interval = 4
format-volume = <label-volume>
label-volume = %percentage%%
label-volume-padding = 10px
format-muted = <label-muted>
label-muted = mut
label-muted-padding = 8px
click-right = pavucontrol



[module/tray]
type = internal/tray
tray-size = 66%
tray-spacing = 6px
tray-padding = 2px
tray-background = #151419
format-margin = 4px



[module/workspace-apps]
label-font = 1
type = custom/script
exec = python ~/.config/polybar/polybar_workspaces.py
tail = true




[module/typing-speed]
type = custom/script
exec = python -u /media/sf_CopyBoard/polybar_typing_speed.py
tail = true
label = %output%
label-padding = 8px